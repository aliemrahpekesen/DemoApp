name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/bist-demo-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bist-demo-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "### BIST Demo · Android APK"
            echo ""
            echo "Debug APK built from commit \`${GITHUB_SHA::7}\`."
            echo ""
            echo "Download the artifact **bist-demo-apk** from this workflow run, then:"
            echo "1. Transfer the \`.apk\` file to your Android phone."
            echo "2. Allow installs from unknown sources for your file manager / browser."
            echo "3. Tap the APK to install."
          } >> "$GITHUB_STEP_SUMMARY"
